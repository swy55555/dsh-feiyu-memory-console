<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8696"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0e5a68" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="960" height="520" fill="#f7fafb"/>
<text x="40" y="42" font-size="16" font-weight="700" fill="#0e5a68">一次 /search 的评分流水线</text><rect x="60" y="80" width="240" height="110" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="180.0" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">① 查询</text><text x="180.0" y="132" text-anchor="middle" font-size="12" fill="#667a80">query + scope</text><rect x="360" y="80" width="240" height="110" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="480.0" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">② 向量化</text><text x="480.0" y="132" text-anchor="middle" font-size="12" fill="#667a80">embed(query)</text><rect x="660" y="80" width="240" height="110" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="780.0" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">③ 候选集</text><text x="780.0" y="132" text-anchor="middle" font-size="12" fill="#667a80">scope / global</text><text x="780.0" y="151" text-anchor="middle" font-size="12" fill="#667a80">active · 未过期</text><line x1="300" y1="135" x2="360" y2="135" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="600" y1="135" x2="660" y2="135" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="780" y1="190" x2="780" y2="240" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="660" y="240" width="240" height="110" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="780.0" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">④ 相似度</text><text x="780.0" y="292" text-anchor="middle" font-size="12" fill="#667a80">余弦 sim</text><rect x="360" y="240" width="240" height="110" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="480.0" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">⑤ 时近性</text><text x="480.0" y="292" text-anchor="middle" font-size="12" fill="#667a80">R = 1/(1 + t/9S)</text><rect x="60" y="240" width="240" height="110" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="180.0" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">⑥ 重要性</text><text x="180.0" y="292" text-anchor="middle" font-size="12" fill="#667a80">0.75 + 0.5 × importance</text><line x1="660" y1="295" x2="600" y2="295" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="360" y1="295" x2="300" y2="295" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="180" y1="350" x2="180" y2="400" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="400" width="880" height="84" rx="10" fill="#eef8fa" stroke="#9fc6cc" filter="url(#shadow)"/><text x="480.0" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0e5a68">score = sim × (0.65 + 0.35 × R) × (0.75 + 0.5 × importance)</text><text x="480.0" y="452" text-anchor="middle" font-size="12" fill="#667a80">⑦ 排序：top-k · min_score　　相关性是主项；R 决定旧事衰减；importance 只在相关性接近时改变排序。</text><text x="40" y="505" font-size="10" fill="#667a80">O(N) 全表扫描：本地几百到几千条时，numpy 一次矩阵乘法即可；超过约 1 万条再考虑 ANN 索引。</text>
</svg>