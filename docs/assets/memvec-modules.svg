<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8696"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0e5a68" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="960" height="700" fill="#f7fafb"/>
<text x="40" y="42" font-size="16" font-weight="700" fill="#0e5a68">memvec 模块总览</text><text x="40" y="64" font-size="11" fill="#667a80">一个进程、一个 SQLite 文件、一个本地向量模型；所有请求都经过 HTTP 层。</text><rect x="40" y="80" width="180" height="50" rx="10" fill="#eef8fa" stroke="#9fc6cc" filter="url(#shadow)"/><text x="130.0" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">QQ 桥接</text><text x="130.0" y="132" text-anchor="middle" font-size="12" fill="#667a80">QQ 消息 / 提示词</text><rect x="40" y="145" width="180" height="50" rx="10" fill="#eef8fa" stroke="#9fc6cc" filter="url(#shadow)"/><text x="130.0" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">DSH 控制台</text><text x="130.0" y="197" text-anchor="middle" font-size="12" fill="#667a80">页面 / API</text><line x1="220" y1="105" x2="290" y2="105" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="220" y1="170" x2="290" y2="170" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="290" y="80" width="220" height="115" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="400.0" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">HTTP 层</text><text x="400.0" y="132" text-anchor="middle" font-size="12" fill="#667a80">127.0.0.1:9881</text><text x="400.0" y="151" text-anchor="middle" font-size="12" fill="#667a80">JSON 接口 · ThreadingHTTPServer</text><text x="400.0" y="170" text-anchor="middle" font-size="12" fill="#667a80">threading.Lock</text><rect x="610" y="80" width="230" height="100" rx="10" fill="#f0fbfd" stroke="#2e8696" filter="url(#shadow)"/><text x="725.0" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">BGE-small-zh</text><text x="725.0" y="132" text-anchor="middle" font-size="12" fill="#667a80">fastembed · ONNX · 512 维 · CPU</text><text x="725.0" y="151" text-anchor="middle" font-size="12" fill="#667a80">写入 / 检索时调用</text><line x1="400" y1="195" x2="400" y2="220" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="120" y="220" width="220" height="100" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="230.0" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">写入器</text><text x="230.0" y="272" text-anchor="middle" font-size="12" fill="#667a80">/add · 校验 · 向量化</text><text x="230.0" y="291" text-anchor="middle" font-size="12" fill="#667a80">去重 · 关系 · 分层</text><rect x="370" y="220" width="220" height="100" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="480.0" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">检索器</text><text x="480.0" y="272" text-anchor="middle" font-size="12" fill="#667a80">/search · 打分 · 过滤 · 排序</text><rect x="620" y="220" width="220" height="100" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="730.0" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">确认与撤销</text><text x="730.0" y="272" text-anchor="middle" font-size="12" fill="#667a80">/confirm · /undo · /manage</text><rect x="120" y="345" width="220" height="100" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="230.0" y="373" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">衰减器</text><text x="230.0" y="397" text-anchor="middle" font-size="12" fill="#667a80">/decay · 幂律 R(t) · 归档</text><rect x="370" y="345" width="220" height="100" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="480.0" y="373" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">原文层</text><text x="480.0" y="397" text-anchor="middle" font-size="12" fill="#667a80">/message(s) · 5000 条/聊天</text><rect x="620" y="345" width="220" height="100" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="730.0" y="373" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">摘要层</text><text x="730.0" y="397" text-anchor="middle" font-size="12" fill="#667a80">/summary · value / kind</text><line x1="480" y1="445" x2="480" y2="505" stroke="#2e8696" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="505" width="840" height="120" rx="10" fill="#f7fafb" stroke="#9fc6cc" stroke-dasharray="6 4"/><text x="80" y="528" font-size="12" font-weight="600" fill="#0e5a68">SQLite · memories.db</text><rect x="80" y="540" width="180" height="60" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="170.0" y="568" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">memories</text><text x="170.0" y="592" text-anchor="middle" font-size="12" fill="#667a80">记忆 · 向量 BLOB</text><rect x="280" y="540" width="180" height="60" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="370.0" y="568" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">memory_operations</text><text x="370.0" y="592" text-anchor="middle" font-size="12" fill="#667a80">确认审计</text><rect x="480" y="540" width="180" height="60" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="570.0" y="568" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">messages</text><text x="570.0" y="592" text-anchor="middle" font-size="12" fill="#667a80">原文</text><rect x="680" y="540" width="180" height="60" rx="10" fill="#ffffff" stroke="#9fc6cc" filter="url(#shadow)"/><text x="770.0" y="568" text-anchor="middle" font-size="15" font-weight="600" fill="#0e5a68">session_summaries</text><text x="770.0" y="592" text-anchor="middle" font-size="12" fill="#667a80">摘要</text><text x="60" y="652" font-size="10" fill="#667a80">写入、检索、衰减、确认都经过 HTTP 层；向量化由本地 BGE 完成。所有模块读写下方同一个 SQLite 文件。</text><text x="60" y="675" font-size="10" fill="#667a80">确认与撤销只碰 memories / memory_operations，不碰原文和摘要；原文层与摘要层各自独立，但共用同一个 scope key。</text>
</svg>